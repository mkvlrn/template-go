[dev]
description = "Run the Go application"
run = "mise exec -- go run . $ARGS"

[lint]
description = "Run linter"
run = "mise exec -- golangci-lint run ./..."

[format]
description = "Format code using gofumpt"
run = "mise exec -- golangci-lint fmt ./..."

[test]
description = "Run tests with coverage"
run = "mise exec -- go test ./... -cover"

[build]
description = "Build the application binary"
run = """
rm -rf ./bin
mkdir -p ./bin
mise exec -- go build -o ./bin/template-go .
"""

[sync-branch]
description = "Sync branch dependencies and tools"
run = """
mise install
mise prune -y
mise exec -- go mod tidy
"""
